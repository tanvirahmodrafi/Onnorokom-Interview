# `docker compose up` starts PostgreSQL, the backend (http://localhost:8080) and the frontend
# (http://localhost:5173). Optional extras:
#   docker compose --profile multi up                  # + a second backend on :8081 (same DB)
#   docker compose --profile test run --rm backend-tests    # backend tests against PostgreSQL
#   docker compose --profile test run --rm frontend-tests   # frontend tests (Vitest)

x-backend-env: &backend-env
  ConnectionStrings__Default: Host=db;Port=5432;Database=school_admission;Username=postgres;Password=postgres;Maximum Pool Size=40
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173,http://127.0.0.1:5173}
  HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: school_admission
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_admission"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: runtime
    environment: *backend-env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Bonus: a second backend process on another port, sharing the same database.
  backend-2:
    profiles: ["multi"]
    build:
      context: ./backend
      target: runtime
    environment: *backend-env
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      TEST_DATABASE_URL: Host=db;Port=5432;Database=school_admission_test;Username=postgres;Password=postgres;Maximum Pool Size=40
    depends_on:
      db:
        condition: service_healthy

  frontend-tests:
    profiles: ["test"]
    build:
      context: ./frontend
      target: test

volumes:
  pgdata:
